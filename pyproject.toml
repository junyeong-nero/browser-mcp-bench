[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-mcp-bench"
version = "0.1.0"
description = "Paired browser MCP evaluation using a subscription-backed Codex harness"
requires-python = ">=3.11"
dependencies = [
    "psutil==7.2.2",
]

[project.scripts]
browser-mcp-bench = "browser_mcp_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["browser_mcp_bench*"]
