[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsune-benchmark"
version = "0.1.0"
description = "Paired browser MCP evaluation using a subscription-backed Codex harness"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11",
    "psutil==7.2.2",
]

[project.scripts]
kitsune-benchmark = "kitsune_benchmark.__main__:main"

[tool.setuptools.packages.find]
include = ["kitsune_benchmark*"]

[tool.setuptools.package-data]
kitsune_benchmark = ["gallery_static/*.js", "gallery_static/*.css"]
